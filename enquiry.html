<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoGlow Skincare | Product Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>EcoGlow Skincare</h1>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Product Details</a></li>
                <li><a href="about.html">Our Story</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Product Enquiry</h2>
            <p>Have a question about our skincare products? Send us an enquiry and our team will get back to you.</p>
        </section>

        <section class="enquiry-section">
            <h2>Send Us an Enquiry</h2>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>

                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" placeholder="What is your enquiry about?" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="6" placeholder="Type your message here..." required></textarea>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 EcoGlow Skincare. All rights reserved.</p>
    </footer>

    <!-- JavaScript File Linking -->
    <script src="js/script.js"></script>

</body>
</html>
